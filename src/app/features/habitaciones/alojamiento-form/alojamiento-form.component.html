<div class="rf-backdrop" (click)="cerrarModal()">
  <div class="rf-modal" (click)="$event.stopPropagation()">
    <div class="rf-modal__head">
      <div>
        <h2>{{ alojamientoAEditar ? 'Editar alojamiento' : 'Nuevo alojamiento' }}</h2>
        <p>{{ esHotelOHostal ? 'Habitación para hotel o hostal' : 'Departamento, cabaña o propiedad completa' }}</p>
      </div>
      <button type="button" class="rf-close" (click)="cerrarModal()">
        <app-icon name="x" [size]="18" />
      </button>
    </div>

    <div class="auth-error" *ngIf="error()">
      <app-icon name="alert" [size]="16" />
      <span>{{ error() }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="rf-form" novalidate>
      <label class="field" *ngIf="establecimientos.length > 1">
        <span>Propiedad / Edificio</span>
        <select formControlName="establecimiento_id">
          <option *ngFor="let e of establecimientos" [ngValue]="e.establecimiento_id">
            {{ e.nombre }} ({{ e.tipo_establecimiento || 'Propiedad' }})
          </option>
        </select>
      </label>

      <div class="field-row">
        <label class="field">
          <span>Tipo de alojamiento</span>
          <select formControlName="tipo_alojamiento">
            <option [ngValue]="null" disabled>Selecciona...</option>
            <option *ngFor="let t of tiposAlojamientoFiltrados" [ngValue]="t.id">{{ t.nombre }}</option>
          </select>
          <small class="field__error" *ngIf="form.get('tipo_alojamiento')?.touched && form.get('tipo_alojamiento')?.invalid">Obligatorio</small>
        </label>
        <label class="field">
          <span>N.° / etiqueta de la unidad</span>
          <input type="text" formControlName="etiqueta_unidad" placeholder="101, Depto A, Cabaña 2..." />
          <small class="field__error" *ngIf="form.get('etiqueta_unidad')?.touched && form.get('etiqueta_unidad')?.invalid">Obligatorio</small>
        </label>
      </div>

      <label class="field">
        <span>Descripción</span>
        <input type="text" formControlName="descripcion_alojamiento" placeholder="Vista a la calle, cama matrimonial, balcón..." />
        <small class="field__error" *ngIf="form.get('descripcion_alojamiento')?.touched && form.get('descripcion_alojamiento')?.invalid">Obligatorio</small>
      </label>

      <div class="field-row">
        <label class="field" *ngIf="esDeptoOCabana">
          <span>N.° de habitaciones / dormitorios</span>
          <input type="number" formControlName="num_habitaciones" min="1" placeholder="2" />
        </label>
        <label class="field">
          <span>Precio por noche (S/)</span>
          <input type="number" formControlName="precio_base" min="0" step="0.01" placeholder="120" />
          <small class="field__error" *ngIf="form.get('precio_base')?.touched && form.get('precio_base')?.invalid">Obligatorio</small>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Huéspedes incluidos</span>
          <input type="number" formControlName="max_huespedes_base" min="1" />
          <small class="field__error" *ngIf="form.get('max_huespedes_base')?.touched && form.get('max_huespedes_base')?.invalid">Obligatorio</small>
        </label>
        <label class="field">
          <span>Huéspedes extra permitidos</span>
          <input type="number" formControlName="max_huespedes_extra" min="0" />
        </label>
      </div>

      <label class="field">
        <span>Costo por huésped extra (S/, opcional)</span>
        <input type="number" formControlName="costo_huesped_extra" min="0" step="0.01" />
      </label>

      <div class="field">
        <span>Foto de la habitación (opcional)</span>
        
        <div class="image-upload-zone" *ngIf="!vistaPreviaImagen()">
          <input type="file" #fileInput accept="image/*" (change)="onArchivoSeleccionado($event)" hidden />
          <button type="button" class="pms-btn pms-btn--outline upload-btn" (click)="fileInput.click()">
            <app-icon name="plus" [size]="16" /> Seleccionar foto de mi dispositivo
          </button>
        </div>

        <div class="image-preview-box" *ngIf="vistaPreviaImagen() as img">
          <img [src]="img" alt="Vista previa" />
          <button type="button" class="remove-img-btn" (click)="quitarImagen()" title="Quitar foto">
            <app-icon name="x" [size]="14" /> Quitar foto
          </button>
        </div>
      </div>

      <button type="submit" class="pms-btn pms-btn--primary rf-submit" [disabled]="cargando()">
        <span *ngIf="!cargando()">{{ alojamientoAEditar ? 'Guardar cambios' : 'Crear alojamiento' }}</span>
        <span *ngIf="cargando()">Guardando…</span>
      </button>
    </form>
  </div>
</div>
