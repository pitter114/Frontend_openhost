<div class="rf-backdrop" (click)="cerrarModal()">
  <div class="rf-modal" (click)="$event.stopPropagation()">
    <div class="rf-modal__head">
      <div>
        <h2>Servicios</h2>
        <p>Los que ofreces a tus huéspedes (desayuno, late checkout, etc.)</p>
      </div>
      <button type="button" class="rf-close" (click)="cerrarModal()">
        <app-icon name="x" [size]="18" />
      </button>
    </div>

    <div class="rf-form">
      <div class="auth-error" *ngIf="error()">
        <app-icon name="alert" [size]="16" />
        <span>{{ error() }}</span>
      </div>

      <div *ngIf="cargando()" class="sp-estado">Cargando servicios…</div>

      <ul class="sp-lista" *ngIf="!cargando()">
        <li *ngFor="let s of servicios()">
          <div>
            <div class="sp-lista__nombre">
              {{ s.nombre_servicio }}
              <span class="pms-badge pms-badge--gray" *ngIf="s.global">Plataforma</span>
            </div>
            <div class="sp-lista__desc" *ngIf="s.descripcion_servicio">{{ s.descripcion_servicio }}</div>
          </div>
          <div class="sp-lista__precio">{{ s.precio_base > 0 ? (s.precio_base + ' €') : 'Sin costo fijo' }}</div>
        </li>
      </ul>

      <button type="button" class="pms-btn pms-btn--outline sp-add" *ngIf="!mostrarForm()" (click)="mostrarForm.set(true)">
        <app-icon name="plus" [size]="15" /> Agregar servicio propio
      </button>

      <form [formGroup]="form" (ngSubmit)="submit()" class="sp-form" *ngIf="mostrarForm()" novalidate>
        <div class="field-row">
          <label class="field">
            <span>Nombre</span>
            <input type="text" formControlName="nombre_servicio" placeholder="Spa, Estacionamiento..." />
            <small class="field__error" *ngIf="form.get('nombre_servicio')?.touched && form.get('nombre_servicio')?.invalid">Obligatorio</small>
          </label>
          <label class="field">
            <span>Precio (€, 0 si no tiene costo fijo)</span>
            <input type="number" formControlName="precio_base" min="0" step="0.01" />
          </label>
        </div>
        <label class="field">
          <span>Descripción (opcional)</span>
          <input type="text" formControlName="descripcion_servicio" placeholder="Breve descripción" />
        </label>
        <button type="submit" class="pms-btn pms-btn--primary rf-submit" [disabled]="guardando()">
          <span *ngIf="!guardando()">Guardar servicio</span>
          <span *ngIf="guardando()">Guardando…</span>
        </button>
      </form>
    </div>
  </div>
</div>
