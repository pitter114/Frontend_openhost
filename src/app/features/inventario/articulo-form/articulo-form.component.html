<div class="rf-backdrop" (click)="cerrarModal()">
  <div class="rf-modal" (click)="$event.stopPropagation()">
    <div class="rf-modal__head">
      <div>
        <h2>{{ articulo ? 'Editar artículo' : 'Nuevo artículo' }}</h2>
        <p>{{ articulo ? 'Modifica la información de tu artículo' : 'Agrega un artículo a tu inventario' }}</p>
      </div>
      <button type="button" class="rf-close" (click)="cerrarModal()">
        <app-icon name="x" [size]="18" />
      </button>
    </div>

    <div class="auth-error" *ngIf="error()">
      <app-icon name="alert" [size]="16" />
      <span>{{ error() }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="rf-form" novalidate>
      <div class="field-row">
        <label class="field">
          <span>Nombre</span>
          <input type="text" formControlName="nombre" placeholder="Champú, Toallas, Café..." />
          <small class="field__error" *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid">Obligatorio</small>
        </label>
        <label class="field">
          <span>Unidad de medida</span>
          <input type="text" formControlName="unidad_medida" placeholder="unidades, litros, kg..." />
          <small class="field__error" *ngIf="form.get('unidad_medida')?.touched && form.get('unidad_medida')?.invalid">Obligatorio</small>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Categoría</span>
          <select formControlName="categoria_articulo_id" *ngIf="!nuevaCategoria()">
            <option [ngValue]="null" disabled>Selecciona...</option>
            <option *ngFor="let c of categoriasLocal()" [ngValue]="c.categoria_articulo_id">{{ c.nombre }}</option>
          </select>
          <div class="cat-inline" *ngIf="nuevaCategoria()">
            <input type="text" [(ngModel)]="categoriaNombre" [ngModelOptions]="{standalone: true}" placeholder="Nombre de la categoría" />
            <button type="button" class="pms-btn pms-btn--sm pms-btn--primary" [disabled]="guardandoCategoria()" (click)="crearCategoriaInline()">
              Crear
            </button>
          </div>
          <button type="button" class="link-btn" (click)="nuevaCategoria.set(!nuevaCategoria())">
            {{ nuevaCategoria() ? 'Cancelar' : '+ Nueva categoría' }}
          </button>
        </label>
        <label class="field">
          <span>Tipo</span>
          <select formControlName="tipo_articulo_id">
            <option [ngValue]="null" disabled>Selecciona...</option>
            <option *ngFor="let t of tiposArticulo()" [ngValue]="t.id">{{ t.nombre }}</option>
          </select>
          <small class="field__error" *ngIf="form.get('tipo_articulo_id')?.touched && form.get('tipo_articulo_id')?.invalid && form.get('tipo_articulo_id')?.dirty">Obligatorio</small>
        </label>
      </div>

      <label class="field">
        <span>Descripción (opcional)</span>
        <input type="text" formControlName="descripcion" placeholder="Notas sobre el artículo" />
      </label>

      <div class="field-row">
        <label class="field">
          <span>Stock mínimo</span>
          <input type="number" formControlName="stock_minimo" min="0" step="0.01" />
          <small class="field__error" *ngIf="form.get('stock_minimo')?.touched && form.get('stock_minimo')?.invalid">Obligatorio</small>
        </label>
        <label class="field">
          <span>Stock objetivo (opcional)</span>
          <input type="number" formControlName="stock_objetivo" min="0" step="0.01" />
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Stock máximo (opcional)</span>
          <input type="number" formControlName="stock_maximo" min="0" step="0.01" />
        </label>
        <label class="field">
          <span>Cantidad inicial en almacén</span>
          <input type="number" formControlName="cantidad_inicial" min="0" step="0.01" />
        </label>
      </div>

      <label class="checkbox-field">
        <input type="checkbox" formControlName="control_individual" />
        <span>Controlar unidades individualmente (ej. equipos, no consumibles a granel)</span>
      </label>
      <label class="checkbox-field">
        <input type="checkbox" formControlName="permite_stock_negativo" />
        <span>Permitir que el stock quede en negativo</span>
      </label>

      <button type="submit" class="pms-btn pms-btn--primary rf-submit" [disabled]="cargando()">
        <span *ngIf="!cargando()">{{ articulo ? 'Guardar cambios' : 'Crear artículo' }}</span>
        <span *ngIf="cargando()">{{ articulo ? 'Guardando…' : 'Creando…' }}</span>
      </button>
    </form>
  </div>
</div>
